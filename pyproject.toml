[project]
name = "cedulauy-mrz-scan"
version = "0.0.1.dev0"
description = "Scan and parse the MRZ (Machine Readable Zone) of Uruguayan identity cards (cédula de identidad)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nicolás Gutiérrez", email = "ngutierreztassano@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []
keywords = ["mrz", "uruguay", "cedula", "identity-card", "ocr", "td1"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

# [project.urls]
# Homepage = "https://github.com/<user>/cedulauy-mrz-scan"
# Repository = "https://github.com/<user>/cedulauy-mrz-scan"
# Issues = "https://github.com/<user>/cedulauy-mrz-scan/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
